<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>万年历 - 浏览器版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <button id="prevBtn" aria-label="上一月">‹</button>
            <h1 id="title"></h1>
            <button id="nextBtn" aria-label="下一月">›</button>
        </header>

        <section class="calendar">
            <div class="week-row">
                <div class="week-cell weekend">日</div>
                <div class="week-cell">一</div>
                <div class="week-cell">二</div>
                <div class="week-cell">三</div>
                <div class="week-cell">四</div>
                <div class="week-cell">五</div>
                <div class="week-cell weekend">六</div>
            </div>
            <div id="grid" class="grid"></div>
        </section>

        <section id="dayPanel" class="day-panel" aria-live="polite"></section>

        <section class="weather-panel">
            <div class="weather-controls">
                <input id="cityCode" placeholder="城市代码，如 101010100" />
                <button id="weatherBtn">查询天气</button>
                <button id="geoBtn">按定位查询</button>
                <button id="cityPickerBtn">选择城市</button>
            </div>
            <div id="weatherResult" class="weather-result"></div>
        </section>

        <section class="astro-panel">
            <div class="astro-controls">
                <select id="astroSelect">
                    <option value="aries">白羊座</option>
                    <option value="taurus">金牛座</option>
                    <option value="gemini">双子座</option>
                    <option value="cancer">巨蟹座</option>
                    <option value="leo">狮子座</option>
                    <option value="virgo">处女座</option>
                    <option value="libra">天秤座</option>
                    <option value="scorpio">天蝎座</option>
                    <option value="sagittarius">射手座</option>
                    <option value="capricorn">摩羯座</option>
                    <option value="aquarius">水瓶座</option>
                    <option value="pisces">双鱼座</option>
                </select>
                <button id="astroBtn">查看星座运势</button>
            </div>
            <div id="astroResult" class="astro-result"></div>
        </section>
    </div>

    <script src="lib/calendar.js"></script>
    <script src="app.js"></script>
    <noscript>需要启用 JavaScript 才能显示日历</noscript>
  </body>
  </html>
